<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AAM Technology builds modern, responsive websites and digital solutions for businesses, startups, and organizations." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <title>AAM Technology — Websites & Digital Solutions</title>
    <meta name="theme-color" content="#f5f8fc" />
    <script>
      // Set the theme before first paint so there is no flash of the wrong one
      var light = false;
      try { light = window.matchMedia('(prefers-color-scheme: light)').matches; } catch (e) {}
      var c = null;
      try { c = localStorage.getItem('aam-theme-choice'); } catch (e) {}
      // A saved Dark pick gives dark, "System" follows the device, and everyone else
      // (new visitors included) gets the light day theme. Matches DEFAULT in useTheme.js.
      document.documentElement.dataset.theme = c === 'dark' ? 'dark' : c === 'system' ? (light ? 'light' : 'dark') : 'light';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
